name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            agent/package-lock.json
            eval-viewer/package-lock.json
      - name: Install the pinned Native SDK CLI
        # The CLI's postinstall downloads scriptc, its TypeScript toolchain,
        # from GitHub releases. Sage's core is Zig and its checks never use
        # scriptc, so CI skips install scripts and cannot fail on that download.
        # Retrying after a failed install does not work: npm then leaves the
        # `native` command without its executable bit.
        run: npm install -g --ignore-scripts "@native-sdk/cli@$(cat .native-sdk-version)"
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix agent ci
          npm --prefix eval-viewer ci
      - run: native validate app.json
      - run: make check
      - run: make test
      - run: make fe-build

  speech:
    name: Build the speech library
    # Dictation's speech engine is Swift for macOS 26, so it needs the macOS 26
    # SDK. `macos-26` is arm64 with Xcode 26. The `ci` job above does not build
    # it, and only the release workflow did, so a Swift error first showed on a
    # release tag. A pinned label keeps the SDK from moving under this check.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check the macOS 26 SDK
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "Dictation's speech library needs the macOS 26 SDK, found $sdk." >&2
            exit 1
          fi
      - name: Compile libSageSpeech.dylib
        # The same command as `addSpeechLibrary` in build.zig, with the library
        # alone: no Zig, no Native SDK, and no package.
        run: |
          out="$RUNNER_TEMP/libSageSpeech.dylib"
          xcrun swiftc -O -swift-version 5 -parse-as-library -emit-library \
            -module-name SageSpeech -target "$(uname -m)-apple-macos26.0" \
            -Xlinker -install_name -Xlinker @rpath/libSageSpeech.dylib \
            -o "$out" src/speech/SageSpeech.swift
          # Sage loads these eight functions by name, so each must be exported.
          count="$(nm -gU "$out" | grep -c ' _sage_speech_')"
          echo "exported sage_speech functions: $count"
          [ "$count" -eq 8 ]
