name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            agent/package-lock.json
            eval-viewer/package-lock.json
      - name: Install the pinned Native SDK CLI
        run: npm install -g "@native-sdk/cli@$(cat .native-sdk-version)"
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix agent ci
          npm --prefix eval-viewer ci
      - run: native validate app.json
      - run: make check
      - run: make test
      - run: make fe-build
