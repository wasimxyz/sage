    weight: medium
  - date: 2026-08-07
    what: "Neil flew in for four days. Mom was bright for him. He said she seemed great and asked what the plan is 'when it gets worse'."
    weight: medium
  - date: 2026-09-04
    what: "Found Mom in the front yard at 5:10 a.m. in her nightgown, waiting for a school bus. She was fine. The author put chimes on both doors the same day."
    weight: big
  - date: 2026-09-10
    what: "First Thursday caregivers' group at the hospital annex."
    weight: small
  - date: 2026-09-21
    what: "Mom turned eighty. She thought the birthday cake was for the author."
    weight: medium
  - date: 2026-09-25
    what: "A day Mom did not know the author at all, called them Carol, and asked to be taken home. The author wrote only 'Lost Mom today. I don't want to talk about it.' and explained the next day."
    weight: big
  - date: 2026-10-15
    what: "Toured Birchwood memory care, $7,800 a month. The author put the brochure in the glove box."
    weight: medium
  - date: 2026-10-22
    what: "At group, Walt said some nights he prays his wife goes in her sleep. The author was not shocked, was shocked by that, and felt protective of their own mother."
    weight: medium
  - date: 2026-10-27
