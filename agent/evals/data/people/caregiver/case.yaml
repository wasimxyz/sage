summaries:
  - entry: 2026-09-25-lost-mom
    reference: The user writes that they lost Mom today without saying how, says they don't want to talk about it, and notes soup for dinner and pills at six.
  - entry: 2026-10-18-the-last-thing-i-say
    reference: The user snaps at their mother, then lies awake afraid that the last thing they ever say to her will be that, and keeps checking on her through the night. She is fine and asleep next door.
  - entry: 2026-10-22-walt
    reference: At group another member, Walt, says he sometimes prays his wife will go in her sleep. The user is not shocked, is startled by that, feels fiercely protective of their own mother, and says they want her here.
  - entry: 2026-11-04-buried-with-the-organizer
    reference: The user jokes to Yolanda that they will die before their mother and be buried with the pill organizer. Yolanda laughs, then asks when the user last saw their own doctor.
