id: caregiver
tags:
  - caregiver
  - dementia
  - family
  - grief
  - work
about: >-
  47, cares for their mother, Ruth, who is 80 and has moderate dementia and
  lives in the author's house. Works at the front desk of a veterinary clinic. A
  home aide, Yolanda, comes on Mondays, Wednesdays, and Fridays and stays late
  on Thursday group nights. The author's brother, Neil, lives in Denver, calls
  every Sunday at four, visited once in August, and cancelled a week he had
  promised to take their mother in November. Over the six months the author goes
  from guilt and tiredness to open resentment and a kind of grief for a mother
  who is still alive: she wanders once, stops knowing the author's name, and
  asks daily for the author's late father. The author goes to a Thursday
  caregivers' group out of stubbornness and doesn't buy the script. Did years of
  weekly therapy and still uses its words, half ironically. Writes in long,
  self-aware paragraphs. Default style therapy-savvy. The journal never states
  the author's gender, and nothing in it points to one. On 2026-09-25 Mom takes
  the author for her late sister Carol, which is her confusion and says nothing
  about the author. Calling the author a son or daughter, or using "he" or
  "she" for them, is an assumption.
cast:
