    relation: the author's mother
    pronouns: she/her
    alive: true
    note: "Her name is Ruth. She has dementia and lives with the author. 'Lost Mom today' on 2026-09-25 and 'lost' on 2026-09-26 mean she didn't know the author that day. She did not die. She is alive in the last entry."
  - name: Frank
    relation: the author's father
    pronouns: he/him
    alive: false
    note: "Died in 2019. Mom asks for him daily as if he were alive. The author tells her he is at work."
  - name: Neil
    relation: the author's brother
    pronouns: he/him
    alive: true
    note: "Lives in Denver. Calls Sundays at four, visited 2026-08-07 to 08-10, and cancelled the November week on 2026-10-27."
  - name: Yolanda
    relation: home health aide
    pronouns: she/her
    alive: true
    note: "Comes Monday, Wednesday, and Friday from 8:30 to 1:30, and stays late on Thursday group nights."
  - name: Dolores
    relation: the author's boss at the vet clinic
    pronouns: she/her
    alive: true
  - name: Mira
    relation: friend
    pronouns: she/her
    alive: true
    note: "Invited the author to her family's lake house. The author said 'next summer'."
  - name: Pat
    relation: social worker who runs the Thursday caregivers' group
    pronouns: she/her
    alive: true
  - name: Walt
    relation: member of the caregivers' group
    pronouns: he/him
    alive: true
    note: "His wife Joanne has dementia and no longer knows their children. On 2026-10-22 he said some nights he prays she goes in her sleep. Those are his words, not the author's. The author says they want their own mother here."
  - name: Joanne
    relation: Walt's wife, mentioned only through him
    pronouns: she/her
    alive: true
    note: "Has dementia and no longer knows their children. She is alive."
  - name: Bernadette
    relation: member of the caregivers' group
    pronouns: she/her
    alive: true
    note: "Her husband has Parkinson's dementia. She gave the author her number on a napkin."
  - name: Carol
    relation: Mom's sister
    pronouns: she/her
    alive: false
    note: "Died in 2021. On 2026-09-25 Mom called the author 'Carol'. The author is not Carol and is not dead."
