id: engaged
tags:
  - relationship
  - travel
  - money
about: >-
  29, engaged to Jordan since July 2026, after four years together. Went to
  Portugal in August and missed a connecting flight in Madrid. Money got tight
  in September: rent worry on the 1st, then a $2,400 car repair on the 20th that
  went on a credit card and made them skip a friend's birthday trip. In October
  they built their first budget in a long time and picked up a few freelance
  hours, and by mid-October felt more in control. Spends time with friends Noor
  and Wes. Writes in a chatty, upbeat voice, with long sentences and plenty of
  small jokes. The journal never states the author's gender. Jordan is a man.
  The journal does not say who went on the Portugal trip.
