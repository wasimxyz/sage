  - entry: 2025-08-19-mom
    reference: The user's father calls to say their mother's face is wrong. The user drives to Batavia fearing they are too late, and finds her alive in the ER with a stroke that was caught early, and stays with their father.
  - entry: 2025-08-31-the-dream
    reference: The user dreams their father has died and gets angry in the dream about his ties, wakes with a racing heart, and calls him to hear him pick up. He is fine.
