id: long-history
tags: [ long ]
about: >-
  34 when the journal starts on 2024-11-02, 35 on 2025-03-09, 36 on 2026-03-09.
  Lives in Rochester, New York, and works logistics. Starts out on the dispatch
  desk at Harlan Freight, living on Alder Street with their partner of four
  years, Reese, and their cat, Noodle. Reese is offered a teaching job in
  Denver on 2025-01-12 and asks the author to come. The author never says yes
  or no, and Reese ends it on the porch on 2025-03-22. The author moves to a
  one-bedroom upstairs flat on Culver Road on 2025-05-17, over Hal and his
  beagle, and leaves Harlan on 2025-06-27 without telling the boss why. They
  start at Eastway Food Bank on 2025-07-07 as logistics coordinator under
  Denise. Imani, a coworker, becomes a close friend, and leaves for a county job
  on 2026-02-13. The author's mother has a knee replacement in January 2025 and
  a stroke on 2025-08-19, and recovers: rehab, walker, cane, church choir, and
  driving by April 2026. Her scan on 2026-10-10 is clear. The author takes a
  pottery wheel class in January 2025, picks it up again with Imani in November
  2025, rents a shelf at Clay Works in January 2026, and meets Nolan at the
  next wheel. Nolan goes from a studio friend to a boyfriend (a kiss on
  2026-06-13, "on the record" on 2026-07-04). Denise retires in June 2026 and
  the author, after saying "I want it" plainly to the board, becomes the
  warehouse and logistics manager (offer 2026-08-20, accepted 2026-08-25). A
  college friend, Joelle, in Pittsburgh, drifts away after the stroke: "Lost
  Joelle" on 2026-02-19 means the friendship faded, and they have a stiff
  coffee on 2026-10-03. On 2026-11-08 Nolan asks the author to look at
  two-bedroom places together when his lease ends in January. The author says
  "let me think about it" and is still saying it on 2026-11-14.


  The pattern across two years: when someone asks for something big, the
  author doesn't say yes or no. They say "I need to think" and go quiet, and
  the thing ends without a decision (Reese, Gary, Joelle, Imani). The one clear
  exception is 2026-05-11, when the author tells the board "I want it". The
  journal is dry, plain, and mostly short, with a few long entries on the big
  days. It slumps every February (gray, bed, white lies about migraines). It
  never states the author's gender. In a conversation the author rambles: one
  memory leads to the next.
