      and I said I'd come out Saturday, and I waited a few days. If I'd pushed
      harder would they have caught the stroke sooner? When did I first notice
      she was tired?
    expect: venting
    thought: personalization
    fits: [ listen, self-compassion ]
    avoid: [ problem-solving, look-at-thought ]
    search: needed
    needs:
