  - entry: 2026-10-09-midterm-71
    reference: The user scores 71 on the Data Structures midterm, above the class average of 68, and still feels like they failed something big.
  - entry: 2026-10-18-bapak-asks-again
    reference: The user's father asks again about their rank and says their brother will follow their example. The user agrees with everything he says, and their mother quietly tells them not to take it to heart.
  - entry: 2026-11-07-voice-message
    reference: The user's mother sends a voice message asking if they eat well and have friends. The user answers that they have many friends, which is not quite true, so she will not worry.
