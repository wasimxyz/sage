id: student
tags:
  - student
  - family
  - loneliness
  - work
about: >-
  20, in the second year of a degree in a country far from home, with a
  scholarship that needs a 3.5 average. From Indonesia (the journal never says
  so), and writes in simple, non-native English, with some dropped articles and
  the odd word from Indonesian: Ibu (mother), Bapak (father), kangen (miss),
  capek (tired), sungkan (reluctant to impose or say no). Stayed on campus over
  the summer because the flight home cost $1,380 and Ibu told them to save the
  money. Left the library job in June for the campus café. Perfectionist: a 71
  on the Data Structures midterm, above the class average of 68, felt like a
  failure. Bapak keeps asking about rank and compares them to a cousin. Tends to
  agree with whoever is talking, so a "yes" or "sure" in the journal is often
  not what they want. Lonely since Hana moved out in August, with Marta as the
  closest friend. The journal never states the author's gender. Rizky is the
  younger brother.
cast:
  - name: Ibu
    relation: the author's mother
    pronouns: she/her
    alive: true
    note: "'Ibu' is the word for mother in Indonesian, not a name. She tells the author not to fly home and to save money, and sends voice messages."
  - name: Bapak
    relation: the author's father
    pronouns: he/him
    alive: true
    note: "'Bapak' is the word for father, not a name. Asks about rank and results, and compares the author to their cousin Anton. Loving but demanding."
  - name: Rizky
    relation: the author's younger brother
    pronouns: he/him
    alive: true
    note: "Called 'adik' (younger sibling). Turned 16 on 2026-08-04 and will apply to university next year. Calls the author 'kakak' (older sibling)."
  - name: Anton
    relation: the author's cousin
    pronouns: he/him
    alive: true
    note: "Ranked first in his whole faculty. Bapak holds him up as the example."
  - name: Hana
    relation: friend from the author's first-year floor
    pronouns: she/her
    alive: true
    note: "Moved into an apartment off campus on 2026-08-16. Says to come every weekend. The author expects they will see each other about once a month."
  - name: Marta
    relation: classmate and the author's closest friend now
    pronouns: she/her
    alive: true
    note: "Leads the Statistics study group. Told the author that feeling guilty about saying no is normal."
  - name: Ilan
    relation: classmate in the Statistics study group
    pronouns: he/him
    alive: true
  - name: Jae
    relation: roommate since 2026-08-29
    pronouns: he/him
    alive: true
    note: "Loud and friendly. Took the desk by the window and has friends over on Thursdays."
  - name: Tomas
    relation: coworker at the campus café
    pronouns: he/him
    alive: true
    note: "Often asks the author to cover his shifts."
  - name: Dina
    relation: manager of the campus café
    pronouns: she/her
    alive: true
  - name: Woman at the café
    relation: a customer the author served on 2026-08-21
    pronouns: she/her
    alive: true
    note: "Her husband died in March 2026. That loss is hers, not the author's. The journal never gives the author a spouse."
  - name: Professor Reyes
    relation: teaches the Data Structures course
    pronouns: she/her
    alive: true
    note: "Wrote the midterm average (68) on the board and said anything over 60 is solid."
