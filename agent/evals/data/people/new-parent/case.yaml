summaries:
  - entry: 2026-07-15-moms-last-night
    reference: On her last night, the user's mother tells the story of the user's colic as a baby and jokes that she loved them so much she could have strangled them. The user laughs and writes that they will miss her.
  - entry: 2026-07-24-the-stairs
    reference: On the stairs the user has a sudden, unwanted picture of dropping Iris. They freeze and hold on tight, feel sick and frightened, and know they would never do it. Iris is fine and the user tells no one.
  - entry: 2026-08-19-the-death-of-me
    reference: Exhausted, the user puts the milk in the cabinet and the cereal in the fridge and jokes that Iris is going to be the death of them. Kit jokes back, and they agree she is also the best thing that has happened to them.
  - entry: 2026-09-09-the-dream-again
    reference: The user describes a recurring dream about losing Iris at a grocery store, then wakes and finds her asleep and safe in the crib.
