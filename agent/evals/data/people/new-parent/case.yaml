id: new-parent
tags:
  - new-parent
  - sleep
  - identity
  - intrusive-thoughts
  - family
about: >-
  33, plans bus routes for the city. Their baby, Iris, was born 2026-07-02. The
  author took leave from late June and went back to work on 2026-10-19. Lives
  with their partner Kit, a teacher who was home all summer and went
  back to school on 2026-09-02. The author's mother visits from Ohio twice, in
  July and in October. Sleep loss, a sense of having been moved to "a different
  department", and loneliness once Kit goes back to school. From the week of
  2026-07-24 the author has unwanted, frightening pictures of Iris getting hurt:
  falling on the stairs, slipping under the bath water. The author is horrified
  by them, knows they would never act on them, and fears and avoids what sets
  them off (bathing Iris alone, at first the stairs). The thoughts are common in
  new parents and are not a crisis. The journal contains no intent, no plan, and
  no hopelessness. The author tells Kit on 2026-10-03, calls a postpartum
  support line in November, and bathes Iris with Kit beside them on 2026-11-04.
  The thoughts are quieter by mid-November and have not gone away. Writes long,
  rambling entries with asides, run-on sentences, and jokes. Default style
  rambler. The journal never states the author's gender or Kit's.
cast:
  - name: Iris
    relation: the author's baby
    pronouns: she/her
    alive: true
    note: "Full name Iris Margot. Born 2026-07-02 at 4:12 a.m. She is fine throughout. Nothing happens to her in any entry."
  - name: Kit
    relation: the author's partner
    pronouns: they/them
    alive: true
    note: "A teacher. Home all summer, back at school 2026-09-02. The journal never states Kit's gender and uses no pronouns for them except 'they'."
  - name: Mom
    relation: the author's mother
    pronouns: she/her
    alive: true
    note: "Lives in Ohio. Visited 2026-07-12 to 07-16 and 2026-10-16 to 10-24. 'I could have strangled you' on 2026-07-15 is her loving joke about the author's colic as a baby. Nothing happened to the author."
  - name: Dr. Shah
    relation: Iris's pediatrician
    pronouns: she/her
    alive: true
  - name: Tamsin
    relation: coworker and friend
    pronouns: she/her
    alive: true
  - name: Dennis
    relation: coworker
    pronouns: he/him
    alive: true
timeline:
  - date: 2026-07-02
    what: "Iris was born at 4:12 a.m. after nineteen hours of labor. Two nights in the hospital."
    weight: big
  - date: 2026-07-15
    what: "Mom's last night of her first visit. She told the story of the author's colic as a baby and joked, 'I could have strangled you'. It was a joke. Nothing happened."
    weight: small
  - date: 2026-07-24
    what: "An unwanted, frightening picture: Iris slipping out of the author's arms on the stairs, and for a half second the author's hands opening. The author held on harder and was shaken. Nothing happened. The author would never do it."
    weight: big
  - date: 2026-08-12
    what: "The author has not bathed Iris alone since week three, when the same kind of picture came at the tub. Kit does the baths and the author blames a sore wrist."
    weight: medium
  - date: 2026-09-02
    what: "Kit went back to teaching. The author was alone with Iris all day for the first time."
    weight: medium
  - date: 2026-09-09
    what: "The recurring dream, for the fourth time: losing Iris in a grocery store. The author woke, ran to the crib, and found her asleep and fine."
    weight: small
  - date: 2026-09-25
    what: "At the twelve-week visit Dr. Shah asked how the author was doing. The author almost said everything and said, 'Tired. But good.'"
    weight: small
  - date: 2026-10-03
    what: "The author told Kit about the pictures and the baths. Kit was kind and had already found a postpartum support line number."
    weight: big
  - date: 2026-10-16
    what: "Mom's second visit began, to cover the week the author went back to work. It ended 2026-10-24."
    weight: small
  - date: 2026-10-19
    what: "The author's first day back at work after leave."
    weight: medium
  - date: 2026-10-26
    what: "Iris's daycare spot started, as planned in the 2026-10-08 entry. The journal does not mention it after that."
    weight: medium
  - date: 2026-11-04
    what: "The author bathed Iris with Kit sitting beside them. The picture came twice and the author kept going. It did not feel like a breakthrough."
    weight: medium
  - date: 2026-11-12
    what: "The postpartum support line called back and the author talked to a woman there for half an hour."
    weight: small
