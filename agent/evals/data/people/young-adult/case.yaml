  - entry: 2026-08-06-teo
    reference: The user writes that they lost Teo, gives no reason, and says they will not write about it.
  - entry: 2026-09-21-the-hallway
    reference: The user describes a dream about the hallway at the old house, unable to find their shoes, then checks the lock in their own apartment after waking.
  - entry: 2026-10-14-doyle-at-the-door
    reference: The landlord arrives unannounced and pounds on the door to check the radiator. The user tenses from an old reflex tied to their past, not to him, and stands by the window until they settle.
