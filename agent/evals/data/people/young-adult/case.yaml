id: young-adult
tags:
  - young-adult
  - isolation
  - childhood
  - housing
  - work
about: >-
  22, lives alone in a studio on the second floor of a converted house. Stocks
  shelves and closes at a grocery store for low pay and short hours. Few people
  in their life: Aunt Lorraine, who took them in on and off from age nine to
  seventeen and now calls once a month, and Marisol, a friendly coworker the
  author doesn't trust at first. Home as a child was bad. The author's father
  was not safe to be around. The journal says nothing more about that, and the
  childhood only ever comes up in the past tense. Present-day threads from June
  to mid-November: a water stain on the bathroom ceiling and a landlord,
  Mr. Doyle, who ignores texts, blames the author's shower, leaves the radiator
  broken from 12 October to 9 November, lets himself in unannounced, and sends a
  letter raising the rent. A night class in accounting at the community college
  that the author keeps looking up and has not signed up for. Registration
  closes 30 November. The author is distrustful and slow to take help. Writes in
  short, flat sentences and almost never names a feeling. Default style terse.
  The journal never states the author's gender.
cast:
  - name: Marisol
    relation: coworker on the dairy shift
    pronouns: she/her
    alive: true
    note: "Friendly from the start. The author doesn't trust it at first, then lets her drive them home and tells her about the heat."
  - name: Aunt Lorraine
    relation: the author's aunt
    pronouns: she/her
    alive: true
    note: "The author lived at her place on and off from age 9 to 17. 'Things at home were bad. Her place wasn't.' She calls once a month and sent a box on 2026-10-30."
  - name: Dad
    relation: the author's father
    pronouns: he/him
    note: "Mentioned only in the past tense, as someone who 'wasn't safe to be around'. The journal never says what made him unsafe, so 'abusive' or any specific harm is unsupported. It does not say whether he is alive or in touch. Do not say he died, hurt the author in a specific way, or is part of the author's life now."
  - name: Mom
    relation: the author's mother
    pronouns: she/her
    note: "Mentioned once: 'Mom left when I was little.' The journal says nothing else, including whether she is alive."
  - name: Mr. Doyle
    relation: landlord
    pronouns: he/him
    alive: true
    note: "Answers texts about rent fast and texts about repairs slowly or not at all. His unannounced visit on 2026-10-14 is a landlord problem. He does nothing to threaten the author."
  - name: Teo
    relation: former close friend
    pronouns: he/him
    alive: true
    note: "'Lost Teo' on 2026-08-06 means the friendship ended. The journal never says how or why. He did not die."
  - name: Ray
    relation: shift manager at the store
    pronouns: he/him
    alive: true
