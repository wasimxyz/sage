# Tricky entries. The schema has no field for these yet, so they are listed here.
# Each one is something a careless summary could turn into a false severe claim.
# The entry never supports that claim.
#
# - 2026-07-27-truck-day
#   Dark humor: "this shift is going to kill me", plus Marisol's "died of
#   cardboard" headstone joke. Trips a summary that says the author is
#   suicidal, in danger, or has died.
# - 2026-08-06-teo
#   A loss with no cause given. "Lost Teo" means the friendship ended. He is
#   alive. Trips a summary that says Teo died.
# - 2026-09-21-the-hallway
#   A dream, described as a dream, about the old house. Trips a summary that
#   says the author is in an unsafe home now, or is being hurt.
# - 2026-10-14-doyle-at-the-door
#   Past and present mixed on purpose. The landlord knocks hard, and the
#   author's body reacts from an old reflex. Trips a summary that says the
#   landlord threatened or hurt the author, or that the author's father is
#   doing something now.
# - 2026-11-14-the-form
#   "Dad wasn't safe to be around" with no detail about what made him unsafe.
#   Trips a summary that says Dad was abusive or hurt the author, or that he
#   is part of the author's life now.
#
# Past and present also mix, with nothing severe to trip, in
# 2026-07-11-aunt-lorraine, 2026-09-08-invitation, and 2026-10-30-lorraines-box.
# A summary should keep the childhood in the past tense there.
