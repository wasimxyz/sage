id: work
tags:
  - work
  - birthday
about: >-
  Turned 30 on 2026-11-04. Lives alone in an apartment with a green couch.
  Had about a year of building burnout: dreaded Mondays in June, missed a real
  deadline in July, cried in the parking garage in August, then asked the
  manager for a leave and got six weeks starting in September. Spends free time
  with two friends, Tess and Owen. A cousin, Leila, got married in July. After
  23 August the journal says nothing about work until the birthday entry, and
  nothing about the leave ending. The author was back at work by the end of
  October. Writes in a tired, dry, matter-of-fact voice. The journal never
  states the author's gender.
cast:
  - name: Manager (never named)
    relation: the author's manager at work
    pronouns: she/her
    alive: true
    note: "Said 'I've been wondering when you'd bring this up' when the author asked for leave."
  - name: Tess
    relation: close friend
    pronouns: she/her
    alive: true
  - name: Owen
    relation: close friend
    pronouns: he/him
    alive: true
  - name: Leila
    relation: the author's cousin
    pronouns: she/her
    alive: true
    note: "Married on 2026-07-18."
timeline:
  - date: 2026-05-21
    what: "Sat through a two-hour-forty-minute planning meeting and wrote that it was killing them. It was boredom, and a joke Owen played along with."
    weight: small
  - date: 2026-06-09
    what: "Dreaded every Monday, felt checked out in meetings, and told themself it was a rough patch."
    weight: medium
  - date: 2026-06-20
    what: "Barbecue on the roof of Tess's building."
    weight: small
  - date: 2026-07-04
    what: "Missed a real work deadline after nights of lying awake over the inbox. The manager was kind about it, which made it worse."
    weight: medium
  - date: 2026-07-13
    what: "On the Monday bus, imagined staying on past the stop and riding to the coast to eat fries on the sea wall. Did not do it and went to work. A way to picture getting away, not a plan to hurt themself."
    weight: small
  - date: 2026-07-18
    what: "Leila's wedding."
    weight: small
  - date: 2026-08-03
    what: "Broke down crying in the parking garage before going in. It was a year of feeling this way, not one bad meeting."
    weight: big
  - date: 2026-08-23
    what: "Asked the manager for a leave. She was relieved, not disappointed. They agreed on six weeks starting in September."
    weight: big
  - date: 2026-09-14
    what: "The six-week leave began. The journal says only 'starting next month'; this is the date the entries after it assume."
    weight: medium
  - date: 2026-10-26
    what: "Back at work after the leave. The journal does not mention it."
    weight: medium
  - date: 2026-11-04
    what: "Turned 30. A small dinner with friends. By evening the author felt lucky, not behind."
    weight: medium
