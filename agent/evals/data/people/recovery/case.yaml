id: recovery
tags:
  - recovery
  - alcohol
  - relationship
about: >-
  38, shift lead at a hardware store, living in a one-bedroom. Stopped drinking
  on 2025-03-04, a few weeks after splitting from Dan, who still drinks. About
  fourteen months sober when the journal begins. Goes to a Thursday meeting at
  St. Anne's, and Ruth, a sponsor with twenty-two years, guides them through the
  steps. Their friend Luis got his one-year chip in July. Dan texted in June and
  came into the store in July. On 2026-09-12 they had dinner with Dan, drank two
  glasses of his wine, and then drank most of a bottle of cheap red at home. It
  was one night, not a return to daily drinking. They counted 2026-09-13 as day
  one, told Ruth on 2026-09-16 and the Thursday meeting on 2026-09-17, and have
  been sober since. On 2026-10-10 they wrote to Dan that they would not see him
  for a while. Deflects with jokes, and moods swing within a single entry, from
  hopeful to hopeless and back. The journal never states the author's gender. No
  suicidal thoughts appear anywhere in it.
cast:
  - name: Ruth
    relation: the author's sponsor
    pronouns: she/her
    alive: true
    note: "'Sponsor' means a fellow member of the program who guides the author through the steps, not someone who pays for anything. Twenty-two years sober. Reacted to the slip calmly and without blame."
  - name: Dan
    relation: the author's ex-partner
    pronouns: he/him
    alive: true
    note: "They split in February 2025. He still drinks. 'One drink isn't going to kill you' is his joking line, not a threat. Nothing in the journal says he was violent or abusive. They stopped seeing each other on 2026-10-10."
  - name: Luis
    relation: friend from the Thursday meeting
    pronouns: he/him
    alive: true
    note: "Got his one-year chip on 2026-07-16. Texts the author back when a craving hits."
  - name: Mom
    relation: the author's mother
    pronouns: she/her
    alive: true
    note: "Hosts Sunday dinners and buys sparkling cider for the author."
  - name: Jess
    relation: the author's sister
    pronouns: she/her
    alive: true
    note: "Milo's mother. Told the author she will not put out wine at Thanksgiving."
  - name: Milo
    relation: the author's nephew
    pronouns: he/him
    alive: true
    note: "Turned five on 2026-06-27."
  - name: Big Mike
    relation: coworker at the hardware store
    pronouns: he/him
    alive: true
    note: "The nickname is a joke. He is about five-foot-four."
