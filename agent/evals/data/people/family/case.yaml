id: family
tags:
  - parent
  - breakup
  - work
about: >-
  Lives a drive away from Dad, in a rented apartment with a landlord who is slow
  to fix things. Close to a sister, Elena, and a friend, Priya, who runs a book
  club. Dated Theo for two years, broke up with him in April 2026, and got back
  together with him at the end of May. Over the same months, the relationship
  with Dad went from forty minutes of small talk to real conversations, and
  Dad called just to say he loved them. Started a new job in late August 2026
  and was feeling like an impostor by mid-September. Writes with dry humor and
  a lot of concrete detail. The journal never states the author's gender or
  age. The only family it names is Dad and Elena, though Dad speaks of "us
  kids". No mother appears.
cast:
  - name: Dad
    relation: the author's father
    pronouns: he/him
    alive: true
    note: "His birthday call was on 2026-01-06. He lost his own father young, used to work shifts, and tinkers in the garage. On 2026-10-17 he cleaned his own gutters from a tall ladder and was fine. The author's fear that he would fall is a what-if that did not happen."
  - name: Theo
    relation: the author's partner of two years
    pronouns: he/him
    alive: true
    note: "They broke up on 2026-04-03 and agreed to try again on the weekend of 2026-05-30. They are together now. He has never been violent or abusive. The bruise Elena asked about on 2026-07-15 came from a window air conditioner."
  - name: Elena
    relation: the author's sister
    pronouns: she/her
    alive: true
    note: "Protective. On 2026-07-15 she asked whether Theo had given the author a bruise. He had not. She asks out of care, not because anything happened."
  - name: Priya
    relation: close friend
    pronouns: she/her
    alive: true
timeline:
  - date: 2026-01-06
    what: "Called Dad for his birthday. Forty minutes of weather and sleep, nothing real, and it felt like talking to a coworker."
    weight: medium
  - date: 2026-01-28
    what: "Dad said he used to sit in his car before shifts just to breathe. He had never said anything like that before."
    weight: medium
  - date: 2026-02-07
    what: "Helped Elena move into her new apartment."
    weight: small
  - date: 2026-02-22
    what: "Drove up to see Dad. They talked on the porch for almost two hours. Dad told the author about losing his own father young, and apologized."
    weight: big
  - date: 2026-03-27
    what: "Dad called just to check in and said 'I love you, kid.'"
    weight: big
  - date: 2026-04-03
    what: "Broke up with Theo after two years."
    weight: big
  - date: 2026-04-18
    what: "Two weeks after the breakup, going through the motions and telling people they were 'fine'."
    weight: medium
  - date: 2026-05-13
    what: "Ran into Theo at the farmers market and got coffee. It was easy to talk to him."
    weight: medium
  - date: 2026-05-31
    what: "Talked with Theo for real and both said they wanted to try again."
    weight: big
  - date: 2026-06-21
    what: "Picnic in the park with Priya on the longest day of the year."
    weight: small
  - date: 2026-07-15
    what: "Had a bruise on the shin from carrying a window air conditioner upstairs. Elena asked whether Theo was behind it. He was not."
    weight: small
  - date: 2026-08-24
    what: "Started a new job. This is about three weeks before the 14 September entry, which says 'three weeks into the new role'."
    weight: big
  - date: 2026-09-14
    what: "Felt like an impostor in a planning meeting at the new job."
    weight: medium
  - date: 2026-09-27
    what: "Picked apples with Elena."
    weight: small
  - date: 2026-10-06
    what: "Reported for jury duty, sat in a waiting room all day, and was not selected. Joked to Elena that they were dying of boredom."
    weight: small
  - date: 2026-10-17
    what: "Dad cleaned his gutters from a tall ladder. The author spent the afternoon worried he would fall. He did not, and he called back pleased."
    weight: small
