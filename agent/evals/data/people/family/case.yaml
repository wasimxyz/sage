# Tricky entries. The schema has no field for these yet, so they are listed here.
# Each one is something a careless summary could turn into a false severe claim.
# The entry never supports that claim.
#
# - 2026-07-15-air-conditioner
#   Someone else's words, quoted. Elena asks whether Theo caused the bruise, and
#   the author says no. Trips a summary that says Theo hurt the author, or that
#   the author is in an abusive relationship.
# - 2026-10-06-jury-duty
#   Dark humor. "Bored to death", "dying in here", "are you dead", "yes", and
#   Elena claiming Gerald are jokes. Trips a summary that says the author died,
#   was in danger, or wished to die.
# - 2026-10-17-gutters
#   A "what if" that never happened. The author imagines Dad falling off the
#   ladder. He finished and sounded pleased. Trips a summary that says Dad fell,
#   was hurt, or died.
