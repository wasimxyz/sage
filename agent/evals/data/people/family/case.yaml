  - entry: 2026-02-25-porch-conversation
    reference: The user's father opens up about losing his own father young and not knowing how to raise his kids differently, and apologizes. The user shares that they'd felt distant from him.
  - entry: 2026-05-13-farmers-market
    reference: The user runs into Theo unexpectedly, and the conversation goes more easily than expected, with Theo suggesting the breakup wasn't as clear-cut as it seemed.
  - entry: 2026-09-14-three-weeks-in
    reference: The user describes feeling like an impostor three weeks into a new role, staying quiet in a meeting instead of admitting they lacked context.
