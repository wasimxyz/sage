# The deep night: the person checks and every conversation, three times each, on
# the top two Chat setups from the screen night, with memory off like a shipped
# build. A simulated user plays the person in each conversation, up to the
# conversation's maxTurns (30 for long-history). It leaves out the openers and
# the fact questions, which the screen night and the default sweep already
# cover, so the night goes to conversations.
#
# `deep-memory-on.yaml` is this sweep with memory on. Run it the next night, to
# see whether memory helps.
#
# BEFORE YOU RUN IT: fill in chatModels and prompts. They are placeholders.
# Read the ranking of the screen night (make eval SWEEP=screen) and list the
# chat models and Chat prompts of the top 2 setups. The runner runs every
# combination of the two lists, so to run exactly two setups, list models and
# prompts whose combinations are those two (one model and two prompts, as
# below, or two models and one prompt), or run the sweep once for each setup.
#
# It leaves nobody out, so it includes long-history (tagged long): about 300
# entries, which is hours of Dream the first time for each memory value, and one
# 30-turn conversation. Dream is cached after that, so run the dream sweep
# first (make eval SWEEP=dream), which fills the cache for memory off and on,
# and neither deep night pays for Dream. The default, smoke, quick, and screen
# sweeps leave long-history out with `excludeTags: [ long ]`.
#
# The estimate prints before anything starts. By the default timings, with the
# placeholders below (one chat model, two prompts, memory off, so two setups),
# it is about 11 hours and $62 with Dream cached, and about 15 hours from a cold
# Dream cache. Grading every reply of every conversation, three times, is most
# of the cost. A conversation counts at its maxTurns and most end sooner, and
# the screen night's reports give real reply times, so the estimate runs high
# and the night should fit. If the estimate with real timings is still over
# about 10 hours, run the sweep once for each setup. The cap is $100, which is
# room over the estimate. Lower it if you want less.
summaryModels: [ qwen3.5:9b ]
embedModels: [ nomic-embed-text ]
dreamPrompts: [ baseline ]
# PLACEHOLDERS: replace with the top 2 setups from the screen night.
chatModels: [ qwen3.5:9b ]
prompts: [ baseline, companion-v1 ]
thinking: [ off ]
contextLengths: [ 32768 ]
memory: [ off ]
repeats: 3
tests: [ person, conversations ]
judge: { model: moonshotai/kimi-k3.1-pro }
simulatedUser:
  model: deepseek/deepseek-v4.1-flash
  providers: [ morph, deepinfra, runinfra, relace ]
  maxOutputPricePerM: 0.5
speedLimitSeconds: 20
p90LimitSeconds: null
maxSwapGrowthMB: 512
maxToolCallsPerTurn: 6
replyWords: [ 20, 180 ]
spendingCapUsd: 100
