# A check of the runner itself: one setup, one person, and one three-turn
# conversation, so the simulated user runs end to end before a deep night.
# Tiny, but the judge check that starts every sweep grades all its items, and
# that is most of the cost, now that it also grades a few short conversations.
# The conversation adds about 3 cents (three reply grades, one
# whole-conversation grade, and a cent of simulated user), and the whole run is
# about $0.30, with no discount for cached input. The $3 cap leaves room for
# that, so the check never stops the sweep for money.
#
# `tags` picks people whose own tags (or whose openers' tags) match, so
# sam-example, the format template, is the only one. Memory is on so the
# memory checks run once, as the first `make eval` did.
summaryModels: [ qwen3.5:9b ]
embedModels: [ nomic-embed-text ]
dreamPrompts: [ baseline ]
chatModels: [ qwen3.5:9b ]
prompts: [ baseline ]
thinking: [ off ]
contextLengths: [ 32768 ]
memory: [ on ]
repeats: 1
tests: [ person, facts, openers, conversations ]
tags: [ example ]
# long-history takes hours to run Dream the first time, so only deep and dream
# sweeps include it.
excludeTags: [ long ]
judge: { model: deepseek/deepseek-v4.1-flash }
speedLimitSeconds: 20
spendingCapUsd: 3
