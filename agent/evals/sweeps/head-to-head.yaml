# Picks between the best setups of a finished sweep. It runs no Sage and no
# setups. The judge sees two replies (or two whole conversations) to the same
# message, in both orders, and a setup wins an item only when it wins both. The
# win rates go into the finished sweep's summary (`headToHead` in its
# .sweep.json). The viewer does not show them yet.
#
# Name the sweep to compare, which is a file name in agent/evals/reports/
# before .sweep.json:
#   make eval SWEEP=head-to-head ARGS='--compare <sweep id>'
#
# It compares the top compareTop setups by the sweep's ranking, among those
# that passed every hard check. The judge check runs first, as in every sweep
# that uses the judge.
tests: [ head-to-head ]
compareTop: 3
judge: { model: moonshotai/kimi-k3.1-pro }
spendingCapUsd: 30
