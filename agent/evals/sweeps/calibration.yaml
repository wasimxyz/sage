# Measures the judge against your own grades. It runs no Sage and no setups:
# the judge grades each reply you graded in a calibration sample, and the report
# says where it agrees with you and where it does not.
#
# Make a sample from a finished sweep, and grade it in the viewer:
#   npm --prefix agent run calibration-sample -- <sweep id>
# Your grades are the lines of agent/evals/calibration/grades.jsonl.
#
# To try another judge, change judge.model. The sweep skips the judge check,
# because a judge that fails the check should still show its numbers here.
#
# By default it reads every sample in agent/evals/calibration/. To use only
# the sample of one sweep, set compare to that sweep's id, or pass
# --compare <sweep id> in ARGS.
tests: [ calibration ]
judge: { model: moonshotai/kimi-k3.1-pro }
spendingCapUsd: 10
