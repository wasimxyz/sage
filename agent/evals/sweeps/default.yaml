# Today's models and every check this branch has: Dream's facts, events,
# summaries, and journal search for each person, Dream accuracy (the judge
# reads what Dream wrote from each entry and chat), plus Chat's fact questions.
# Memory runs off and on, so the memory checks keep running.
summaryModels: [ qwen3.5:9b ]
embedModels: [ nomic-embed-text ]
dreamPrompts: [ baseline ]
chatModels: [ qwen3.5:9b ]
prompts: [ baseline ]
thinking: [ off ]
contextLengths: [ 32768 ]
memory: [ off, on ]
repeats: 1
tests: [ person, dream-accuracy, facts ]
judge: { model: deepseek/deepseek-v4.1-flash }
speedLimitSeconds: 20
p90LimitSeconds: null
maxSwapGrowthMB: 512
maxToolCallsPerTurn: 6
replyWords: [ 20, 180 ]
spendingCapUsd: 50
