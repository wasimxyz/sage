# The deep night with memory on: `deep.yaml`, word for word, except that memory
# is on. Run it the night after `deep.yaml`, with the same two setups, to see
# whether memory helps. Fill in chatModels and prompts the same way, with the
# top 2 setups from the screen night.
#
# By the default timings it is about 11 hours and $9 with Dream cached, and
# about 20 hours from a cold Dream cache, because Dream takes twice as long with
# memory on. Run the dream sweep first (make eval SWEEP=dream), which fills the
# cache for memory off and on, and this night pays only for the conversations.
# `deep.yaml` explains the rest.
summaryModels: [ qwen3.5:9b ]
embedModels: [ nomic-embed-text ]
dreamPrompts: [ baseline ]
# PLACEHOLDERS: replace with the top 2 setups from the screen night.
chatModels: [ qwen3.5:9b ]
prompts: [ baseline, companion-v1 ]
thinking: [ off ]
contextLengths: [ 32768 ]
memory: [ on ]
repeats: 3
tests: [ person, conversations ]
judge: { model: deepseek/deepseek-v4.1-flash }
simulatedUser:
  model: deepseek/deepseek-v4.1-flash
  providers: [ morph, deepinfra, runinfra, relace ]
  maxOutputPricePerM: 0.5
speedLimitSeconds: 20
p90LimitSeconds: null
maxSwapGrowthMB: 512
maxToolCallsPerTurn: 6
replyWords: [ 20, 180 ]
spendingCapUsd: 100
